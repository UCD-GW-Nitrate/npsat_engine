# Run from the repository root. Paths.Main is relative to the working directory.
[Paths]
Main = examples/shared_flow
Input = input
Output = output
[Geometry]
Type = BOX
BoxDims = 100,100,12
BoxLLP = 0,0,0
Top = top.master
Bottom = bottom.master
[Discretization]
Nxyz = 2,2,1
Vertical = 0,1
[BC]
Dirichlet = dirichlet.dat
Neumann =
GHB =
HalfWidth = 20
MinOverlap = 5
[Properties]
Kxy = conductivity.master
Kz =
Sy =
Ss =
[Sources]
Rch_Data = recharge.master
Rch_factor = 1
Well_Data =
Well_Rates =
Well_factor = 1
Stream_Data =
Stream_Rates =
Stream_factor = 1
[Simulation]
Steady_state = 1
Start_step = 1
Nsteps = 2
Confined = 1
Delta_time_file =
[Solver]
System_iterations = 1000
System_tol = 1e-8
[Output]
Prefix = scenario1
Print_vtk = 1
[FEM]
Porosity = porosity.master
MeshIterations = 1
MaxRefinements = 0
WellModel = legacy
[Tracing]
EnableParticleTracking = 0
